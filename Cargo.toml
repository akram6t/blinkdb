[package]
name = "rustforge"
version = "0.1.0"
edition = "2021"

[lib]
name = "rustforge"
path = "src/lib.rs"

[[bin]]
name = "rustforge-server"
path = "src/main.rs"

[[bin]]
name = "rf-bench"
path = "src/bin/rf-bench.rs"

[[bin]]
name = "scc-bench"
path = "src/bin/scc_bench.rs"

[dependencies]
ahash = "0.8"
libc = "0.2"
monoio = { version = "0.2.4", features = ["iouring", "sync", "bytes"] }
scc = "3.8.8"
dashmap = "6.1.0"
mimalloc = { version = "0.1.52", default-features = false }
core_affinity = "0.8.3"
bytes = "1.10"
crossbeam = "0.8"
crossbeam-channel = "0.5"
parking_lot = "0.12"
bitflags = "2.8"
zerocopy = { version = "0.8", features = ["derive"] }
crc32fast = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
memchr = "2.7"
itoa = "1.0"
smallvec = "1.13"
log = "0.4"
env_logger = "0.11"
socket2 = { version = "0.5", features = ["all"] }
nix = { version = "0.29", features = ["socket", "net", "fs"] }
tempfile = "3.17"
rand = "0.8"
hdrhistogram = "7.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
